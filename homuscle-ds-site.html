/* ============================================================================
   HOMUSCLE DESIGN TOKENS
   이 문서 사이트 자체가 아래 토큰만으로 만들어져 있습니다 (도그푸딩).
   값의 출처는 Figma "DS practice" 파일입니다.
============================================================================ */
:root{
  /* PRIMITIVE — Mono (웜그레이 13단계) */
  --mono-010:#fefcfb; --mono-030:#f2f0ef; --mono-050:#e1dfde; --mono-100:#cecccb;
  --mono-200:#b6b4b3; --mono-300:#9d9b9a; --mono-400:#848281; --mono-500:#666463;
  --mono-600:#393736; --mono-700:#272524; --mono-800:#1d1b1a; --mono-900:#111111; --mono-990:#0a0a0a;

  /* PRIMITIVE — Primary (오렌지 13단계) */
  --primary-010:#fff8f5; --primary-030:#fff3ed; --primary-050:#ffefe6; --primary-100:#ffdcce;
  --primary-200:#ffb699; --primary-300:#ff8f5c; --primary-400:#ff7726; --primary-500:#ff6300;
  --primary-600:#d94800; --primary-700:#a63200; --primary-800:#732000; --primary-900:#421100; --primary-990:#240900;

  /* PRIMITIVE — Red (경고/삭제, 10단계 · v1.7.0) — Primary(주황)와 겹치지 않게 로즈 레드 쪽으로, 채도는 낮게 */
  --red-050:#fbeaea; --red-100:#f6cfcf; --red-200:#f0a3a3; --red-300:#e08a8a; --red-400:#d36f71;
  --red-500:#c4585b; --red-600:#9a4447; --red-700:#5a2a2b; --red-800:#3f1d1e; --red-900:#2a1415;

  /* PRIMITIVE — Base */
  --base-white:#ffffff; --base-black:#000000;

  /* SEMANTIC — 표면 / 텍스트 */
  --bg:var(--mono-990); --surface:var(--mono-900); --border:var(--mono-800); --muted:var(--mono-600);
  --sub:var(--mono-400); --aux:var(--mono-300); --text:var(--mono-100); --em:#ffffff;
  --accent:var(--primary-500); --accent-dim:rgba(255,99,0,.125);

  /* SEMANTIC — Elevation (구조형 표면 밝기 단계) */
  --elevation-0:var(--mono-990); --elevation-1:var(--mono-900); --elevation-2:var(--mono-800);
  --elevation-3:var(--mono-700); --elevation-4:var(--mono-600);

  /* SEMANTIC — Button */
  --btn-primary-bg:var(--primary-400); --btn-primary-bg-hover:var(--primary-500); --btn-primary-bg-dim:var(--mono-700);
  --btn-primary-text:var(--base-black); --btn-primary-text-dim:var(--mono-500);
  --btn-secondary-border:var(--primary-400); --btn-secondary-border-dim:var(--mono-600);
  --btn-secondary-text:var(--primary-400); --btn-secondary-text-dim:var(--mono-500);
  --btn-secondary-bg-hover:var(--mono-700);
  --btn-tertiary-bg:var(--mono-900); --btn-tertiary-bg-hover:var(--mono-600);
  --btn-tertiary-border:var(--mono-800); --btn-tertiary-border-hover:var(--mono-600);
  --btn-tertiary-text:var(--mono-100); --btn-tertiary-text-dim:var(--mono-600);
  /* Button/Danger — 평소엔 차분하게, hover에서만 또렷하게 (v1.7.0) */
  --btn-quaternary-border:var(--red-700); --btn-quaternary-border-dim:var(--mono-600);
  --btn-quaternary-text:var(--red-300); --btn-quaternary-text-dim:var(--mono-500);
  --btn-quaternary-bg-hover:var(--red-900);
  --btn-quaternary-border-hover:var(--red-500); --btn-quaternary-text-hover:var(--red-200);

  /* SPACING — 17단계 (0~120px) */
  --space-0:0px; --space-2:2px; --space-4:4px; --space-6:6px; --space-8:8px; --space-10:10px;
  --space-12:12px; --space-16:16px; --space-20:20px; --space-24:24px; --space-28:28px; --space-32:32px;
  --space-40:40px; --space-48:48px; --space-64:64px; --space-80:80px; --space-120:120px;

  /* RADIUS — 7단계 */
  --radius-0:0px; --radius-4:4px; --radius-8:8px; --radius-12:12px;
  --radius-16:16px; --radius-20:20px; --radius-1000:1000px;

  /* OPACITY — Black / White / Primary × 5~90% */
  --op-black-05:rgba(0,0,0,.05); --op-black-10:rgba(0,0,0,.1); --op-black-20:rgba(0,0,0,.2);
  --op-black-30:rgba(0,0,0,.3); --op-black-40:rgba(0,0,0,.4); --op-black-50:rgba(0,0,0,.5);
  --op-black-60:rgba(0,0,0,.6); --op-black-70:rgba(0,0,0,.7); --op-black-80:rgba(0,0,0,.8); --op-black-90:rgba(0,0,0,.9);
  --op-white-05:rgba(255,255,255,.05); --op-white-10:rgba(255,255,255,.1); --op-white-20:rgba(255,255,255,.2);
  --op-white-30:rgba(255,255,255,.3); --op-white-40:rgba(255,255,255,.4); --op-white-50:rgba(255,255,255,.5);
  --op-white-60:rgba(255,255,255,.6); --op-white-70:rgba(255,255,255,.7); --op-white-80:rgba(255,255,255,.8); --op-white-90:rgba(255,255,255,.9);
  --op-primary-05:rgba(255,99,0,.05); --op-primary-10:rgba(255,99,0,.1); --op-primary-20:rgba(255,99,0,.2);
  --op-primary-30:rgba(255,99,0,.3); --op-primary-40:rgba(255,99,0,.4); --op-primary-50:rgba(255,99,0,.5);
  --op-primary-60:rgba(255,99,0,.6); --op-primary-70:rgba(255,99,0,.7); --op-primary-80:rgba(255,99,0,.8); --op-primary-90:rgba(255,99,0,.9);

  /* GLOW — 인터랙션 강조 */
  --glow-resting:0 0 22px rgba(255,99,0,.14), 0 0 16px rgba(255,99,0,.07);
  --glow-active:0 0 34px rgba(255,99,0,.35), 0 0 20px rgba(255,99,0,.14);
  --glow-lift:0 14px 30px -14px rgba(255,99,0,.5);

  /* TYPOGRAPHY — 13단계 */
  --fs-h1:56px; --lh-h1:64.4px;  --fs-h2:48px; --lh-h2:57.6px;  --fs-h3:40px; --lh-h3:50px;
  --fs-h4:32px; --lh-h4:41.6px;  --fs-h5:28px; --lh-h5:37.8px;  --fs-h6:24px; --lh-h6:33.6px;
  --fs-b1:20px; --lh-b1:34px;  --fs-b2:18px; --lh-b2:30px;  --fs-b3:16px; --lh-b3:28px;
  --fs-b4:14px; --lh-b4:24px;  --fs-b5:12px; --lh-b5:20px;
  --fs-c1:11px; --lh-c1:18px;  --fs-c2:10px; --lh-c2:16px;

  /* 사이트 셸 전용 */
  --header-h:60px; --sidebar-w:250px; --toc-w:200px; --content-max:760px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + 24px)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* ============================ HEADER ============================ */
header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--space-28);
  background:rgba(10,10,10,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:var(--space-10);cursor:pointer;text-decoration:none}
.brand .wordmark{height:13px;width:auto;color:var(--primary-500);display:block}
.brand .sublabel{color:var(--mono-500);font-size:var(--fs-c1);font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.top-nav{display:flex;gap:var(--space-4);align-items:center}
.top-nav a{
  color:var(--mono-300);font-weight:600;font-size:var(--fs-b4);text-decoration:none;
  padding:var(--space-6) var(--space-12);border-radius:var(--radius-8);
  transition:color .15s ease,background-color .15s ease;
}
.top-nav a:hover{color:var(--mono-050);background:var(--mono-800)}
.top-nav a.active{color:var(--em);background:var(--mono-800)}
.header-meta{color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace;letter-spacing:.04em}

/* ============================ LAYOUT ============================ */
.layout{display:flex;align-items:flex-start;padding-top:var(--header-h)}

/* --- Sidebar --- */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;position:sticky;top:var(--header-h);
  height:calc(100vh - var(--header-h));overflow-y:auto;
  padding:var(--space-24) var(--space-16) var(--space-64) var(--space-28);
  border-right:1px solid var(--border);
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--mono-800);border-radius:3px}
.search-wrap{position:relative;margin-bottom:var(--space-20)}
.search-wrap input{
  width:100%;background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-8);
  padding:var(--space-8) var(--space-12) var(--space-8) 30px;color:var(--text);
  font-family:inherit;font-size:var(--fs-b5);outline:none;transition:border-color .15s ease;
}
.search-wrap input:focus{border-color:var(--mono-600)}
.search-wrap input::placeholder{color:var(--mono-500)}
.search-wrap .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mono-500);font-size:var(--fs-b5);pointer-events:none}
.side-group{margin-bottom:var(--space-24)}
.side-group-label{
  color:var(--mono-500);font-size:var(--fs-c1);font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;padding:0 var(--space-10);margin-bottom:var(--space-8);
}
.side-link{
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);
  color:var(--mono-300);font-size:var(--fs-b4);text-decoration:none;
  padding:var(--space-6) var(--space-10);border-radius:var(--radius-8);margin-bottom:2px;
  transition:color .12s ease,background-color .12s ease;
}
.side-link:hover{color:var(--mono-050);background:var(--mono-900)}
.side-link.active{color:var(--em);background:var(--mono-800);font-weight:600}
.side-link .wip{
  color:var(--mono-500);font-size:var(--fs-c2);font-weight:700;letter-spacing:.06em;
  border:1px solid var(--mono-700);border-radius:var(--radius-1000);padding:1px 6px;flex-shrink:0;
}
.side-empty{color:var(--mono-500);font-size:var(--fs-b5);padding:var(--space-10)}

/* --- Content --- */
.content-wrap{flex:1;min-width:0;display:flex;justify-content:flex-start;padding:var(--space-40) var(--space-40) var(--space-120) var(--space-64)}
main{width:100%;max-width:var(--content-max)}

/* --- TOC --- */
.toc{
  width:var(--toc-w);flex-shrink:0;position:sticky;top:var(--header-h);
  height:calc(100vh - var(--header-h));overflow-y:auto;
  padding:var(--space-40) var(--space-28) var(--space-64) 0;
}
.toc-label{color:var(--mono-500);font-size:var(--fs-c1);font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:var(--space-12)}
.toc a{
  display:block;color:var(--mono-400);font-size:var(--fs-b5);text-decoration:none;
  padding:var(--space-4) 0 var(--space-4) var(--space-12);
  border-left:1px solid var(--mono-800);line-height:1.5;
  transition:color .12s ease,border-color .12s ease;
}
.toc a:hover{color:var(--mono-100)}
.toc a.active{color:var(--primary-400);border-left-color:var(--primary-400)}
@media (max-width:1180px){ .toc{display:none} }
@media (max-width:900px){
  .sidebar{display:none}
  .content-wrap{padding:var(--space-28) var(--space-20) var(--space-80)}
  .top-nav a{padding:var(--space-6) var(--space-8);font-size:var(--fs-b5)}
  .header-meta{display:none}
}

/* ============================ 문서 타이포 ============================ */
.breadcrumb{color:var(--mono-500);font-size:var(--fs-b5);font-weight:600;margin-bottom:var(--space-16);letter-spacing:.02em}
.breadcrumb span{color:var(--mono-700);margin:0 var(--space-6)}
main h1{
  color:var(--em);font-size:var(--fs-h3);line-height:var(--lh-h3);font-weight:900;
  letter-spacing:-.035em;margin-bottom:var(--space-16);
}
@media (max-width:700px){ main h1{font-size:var(--fs-h5);line-height:var(--lh-h5)} }
.lead{color:var(--mono-200);font-size:var(--fs-b2);line-height:var(--lh-b2);margin-bottom:var(--space-32);word-break:keep-all}
main h2{
  color:var(--em);font-size:var(--fs-h6);line-height:var(--lh-h6);font-weight:800;letter-spacing:-.02em;
  margin:var(--space-64) 0 var(--space-16);padding-top:var(--space-8);
}
main h3{color:var(--mono-050);font-size:var(--fs-b2);line-height:var(--lh-b2);font-weight:700;margin:var(--space-32) 0 var(--space-12)}
main p{color:var(--mono-300);font-size:var(--fs-b3);line-height:var(--lh-b3);margin-bottom:var(--space-16);word-break:keep-all}
main ul{color:var(--mono-300);font-size:var(--fs-b3);line-height:var(--lh-b3);padding-left:var(--space-20);margin-bottom:var(--space-16)}
main li{margin-bottom:var(--space-6);word-break:keep-all}
main b,main strong{color:var(--mono-050);font-weight:700}
main a.inline{color:var(--primary-400);text-decoration:none;border-bottom:1px solid var(--primary-800)}
main a.inline:hover{border-bottom-color:var(--primary-400)}
code{
  font-family:'SFMono-Regular',Consolas,monospace;font-size:.88em;
  background:var(--mono-800);color:var(--primary-200);padding:2px 6px;border-radius:var(--radius-4);
}

/* ============================ 문서 컴포넌트 ============================ */
/* 토큰 표 */
.tbl-wrap{overflow-x:auto;margin-bottom:var(--space-16)}
table.tokens{width:100%;border-collapse:collapse;font-size:var(--fs-b4);line-height:var(--lh-b4)}
table.tokens th{
  text-align:left;color:var(--mono-500);font-size:var(--fs-c1);font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;padding:0 var(--space-16) var(--space-10) 0;border-bottom:1px solid var(--mono-700);white-space:nowrap;
}
table.tokens td{padding:var(--space-10) var(--space-16) var(--space-10) 0;border-bottom:1px solid var(--border);color:var(--mono-200);vertical-align:middle}
table.tokens td.mono{font-family:'SFMono-Regular',Consolas,monospace;color:var(--mono-400);white-space:nowrap}
table.tokens td.val{font-family:'SFMono-Regular',Consolas,monospace;color:var(--primary-300);white-space:nowrap}
table.tokens td.name{color:var(--em);font-weight:600;white-space:nowrap}
table.tokens tr:last-child td{border-bottom:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:var(--radius-4);margin-right:var(--space-8);vertical-align:-1px;border:1px solid rgba(255,255,255,.14)}

/* 노트 */
.note{
  background:var(--mono-900);border:1px solid var(--border);border-left:2px solid var(--primary-500);
  border-radius:var(--radius-8);padding:var(--space-16) var(--space-20);margin-bottom:var(--space-16);
}
.note .note-cap{color:var(--primary-400);font-size:var(--fs-c1);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:var(--space-6)}
.note p{color:var(--mono-300);font-size:var(--fs-b4);line-height:var(--lh-b4);margin:0}
.note p + p{margin-top:var(--space-8)}

/* Do / Don't */
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16);margin-bottom:var(--space-16)}
@media (max-width:700px){ .guide-grid{grid-template-columns:1fr} }
.guide-col{background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-12);padding:var(--space-20)}
.guide-col.do{border-top:2px solid var(--primary-400)}
.guide-col.dont{border-top:2px solid var(--red-300)}
.guide-cap{font-size:var(--fs-c1);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:var(--space-12)}
.guide-col.do .guide-cap{color:var(--primary-400)}
.guide-col.dont .guide-cap{color:var(--red-300)}
.guide-col ul{list-style:none;padding:0;margin:0}
.guide-col li{color:var(--mono-300);font-size:var(--fs-b4);line-height:var(--lh-b4);margin-bottom:var(--space-10);padding-left:var(--space-16);position:relative}
.guide-col li:last-child{margin-bottom:0}
.guide-col li::before{position:absolute;left:0;font-weight:800}
.guide-col.do li::before{content:'+';color:var(--primary-400)}
.guide-col.dont li::before{content:'\00d7';color:var(--red-300)}

/* 카드 그리드 (Overview 페이지) */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:var(--space-16);margin-bottom:var(--space-16)}
.doc-card{
  display:block;text-decoration:none;background:var(--mono-900);border:1px solid var(--border);
  border-radius:var(--radius-12);padding:var(--space-20);transition:border-color .15s ease,transform .15s ease;
}
.doc-card:hover{border-color:var(--mono-600);transform:translateY(-2px)}
.doc-card .dc-thumb{
  height:82px;border-radius:var(--radius-8);margin-bottom:var(--space-16);
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--mono-800);
}
.doc-card .dc-title{color:var(--em);font-size:var(--fs-b3);line-height:var(--lh-b3);font-weight:700;margin-bottom:var(--space-4)}
.doc-card .dc-desc{color:var(--mono-400);font-size:var(--fs-b5);line-height:var(--lh-b5);word-break:keep-all}
.doc-card.is-wip{opacity:.55}
.doc-card.is-wip .dc-title::after{
  content:'준비 중';margin-left:var(--space-8);font-size:var(--fs-c2);font-weight:700;color:var(--mono-400);
  border:1px solid var(--mono-700);border-radius:var(--radius-1000);padding:1px 6px;vertical-align:2px;
}

/* 예시 프레임 */
.demo{
  background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-12);
  padding:var(--space-28);margin-bottom:var(--space-16);
}
.demo.pad-lg{padding:var(--space-40)}
.demo-cap{color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace;margin-top:var(--space-10);letter-spacing:.04em}

/* 색상 스와치 */
.swatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-8);margin-bottom:var(--space-16)}
.swatch{border-radius:var(--radius-8);overflow:hidden;border:1px solid var(--border)}
.swatch .fill{height:56px}
.swatch .lab{background:var(--mono-900);padding:var(--space-6) var(--space-8)}
.swatch .lab b{display:block;color:var(--mono-050);font-size:var(--fs-c1);font-weight:700;line-height:1.4}
.swatch .lab span{color:var(--mono-500);font-family:monospace;font-size:var(--fs-c2)}

/* 스페이싱 룰러 */
.space-row{display:flex;align-items:center;gap:var(--space-16);margin-bottom:var(--space-8)}
.space-row .nm{width:104px;flex-shrink:0;color:var(--mono-400);font-size:var(--fs-b5);font-family:monospace}
.space-row .bar{background:var(--primary-400);height:12px;border-radius:var(--radius-4)}
.space-row .px{color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace}

/* 라운드 */
.radius-grid{display:flex;gap:var(--space-16);flex-wrap:wrap}
.radius-item{text-align:center}
.radius-item .box{width:72px;height:72px;background:var(--mono-700);border:1px solid var(--mono-600)}
.radius-item .cap{margin-top:var(--space-8);color:var(--mono-400);font-size:var(--fs-c1);font-family:monospace}

/* 오퍼시티 램프 */
.op-row{display:flex;align-items:center;gap:var(--space-12);margin-bottom:var(--space-8)}
.op-row .nm{width:76px;flex-shrink:0;color:var(--mono-400);font-size:var(--fs-b5);font-family:monospace}
.op-ramp{display:flex;flex:1;border-radius:var(--radius-8);overflow:hidden;border:1px solid var(--border)}
.op-chip{flex:1;height:36px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.op-chip i{font-style:normal;font-size:var(--fs-c2);color:var(--mono-100);font-family:monospace;opacity:.8}
.op-bg-dark{background:var(--mono-990)}
.op-bg-mid{background:var(--mono-700)}

/* Elevation / Glow */
.elev-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-10);margin-bottom:var(--space-16)}
@media (max-width:700px){ .elev-grid{grid-template-columns:repeat(2,1fr)} }
.elev-card{border-radius:var(--radius-8);padding:var(--space-20) var(--space-12);text-align:center;border:1px solid var(--mono-700)}
.elev-card b{display:block;color:var(--em);font-size:var(--fs-b5);margin-bottom:var(--space-4)}
.elev-card span{color:var(--mono-400);font-size:var(--fs-c2);font-family:monospace}
.glow-grid{display:flex;gap:var(--space-24);flex-wrap:wrap}
.glow-chip{
  width:136px;height:72px;background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-8);
  display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800;font-size:var(--fs-b5);
}
.glow-chip.resting{box-shadow:var(--glow-resting)}
.glow-chip.active{box-shadow:var(--glow-active)}
.glow-chip.lift{box-shadow:var(--glow-lift)}
.glow-cap{text-align:center;margin-top:var(--space-10);color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace}

/* 타이포 스케일 행 */
.type-row{border-bottom:1px solid var(--border);padding:var(--space-20) 0}
.type-row:last-child{border-bottom:none}
.type-meta{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-16);margin-bottom:var(--space-8)}
.type-meta b{color:var(--primary-400);font-weight:800;font-size:var(--fs-b4)}
.type-meta span{color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace;white-space:nowrap}
.type-sample{color:var(--em);word-break:keep-all;overflow:hidden}

/* ============================ 로고 ============================ */
.logo-stage{
  background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-12);
  min-height:132px;display:flex;align-items:center;justify-content:center;padding:var(--space-32);
}
.logo-stage.on-light{background:var(--mono-030);border-color:var(--mono-050)}
.logo-stage svg{display:block;max-width:100%;color:var(--primary-500)}
.logo-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16);margin-bottom:var(--space-16)}
@media (max-width:700px){ .logo-pair{grid-template-columns:1fr} }
.logo-cap{color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace;margin-top:var(--space-8);text-align:center}
.clearspace{position:relative;display:inline-block;padding:24px;outline:1px dashed var(--mono-600)}
.clearspace::before{
  content:'';position:absolute;inset:24px;outline:1px solid var(--primary-800);
}

/* ============================ 아이콘 ============================ */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--space-8)}
.icon-cell{
  background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-8);
  padding:var(--space-16) var(--space-8) var(--space-10);text-align:center;
}
.icon-cell svg{display:block;margin:0 auto var(--space-10);color:var(--text)}
.icon-cell .nm{color:var(--mono-500);font-size:var(--fs-c2);font-family:monospace;word-break:break-all}
.icon-sizes{display:flex;align-items:flex-end;gap:var(--space-24);flex-wrap:wrap}
.icon-sizes .is-item{text-align:center}
.icon-sizes svg{display:block;color:var(--text);margin:0 auto var(--space-8)}
.icon-sizes .is-cap{color:var(--mono-500);font-size:var(--fs-c1);font-family:monospace}
.icon-colors{display:flex;gap:var(--space-16);flex-wrap:wrap}
.icon-colors .ic-item{
  background:var(--mono-900);border:1px solid var(--border);border-radius:var(--radius-8);
  padding:var(--space-16);text-align:center;min-width:112px;
}
.icon-colors .ic-item svg{display:block;margin:0 auto var(--space-10)}
.icon-colors .ic-cap{color:var(--mono-500);font-size:var(--fs-c2);font-family:monospace}
.keyline-wrap{display:flex;gap:var(--space-24);align-items:center;flex-wrap:wrap}
.keyline-box{
  width:168px;height:168px;background:var(--mono-900);border:1px solid var(--border);
  border-radius:var(--radius-8);display:flex;align-items:center;justify-content:center;
}

/* ============================ BUTTON SYSTEM ============================ */
.btn{
  font-family:'Pretendard',sans-serif;font-weight:500;border:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-4);
  text-align:center;white-space:nowrap;
  transition:background-color .15s ease,border-color .15s ease,color .15s ease;
}
.btn--48{height:48px;padding:0 var(--space-28);border-radius:var(--radius-12);font-size:var(--fs-b4);line-height:var(--lh-b4)}
.btn--40{height:40px;padding:0 var(--space-20);border-radius:var(--radius-12);font-size:var(--fs-b5);line-height:var(--lh-b5)}
.btn--32{height:32px;padding:0 var(--space-16);border-radius:var(--radius-8);font-size:var(--fs-b5);line-height:var(--lh-b5)}
.btn .spinner{display:none;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:btnspin .7s linear infinite}
.btn--48 .spinner{width:24px;height:24px}
.btn--40 .spinner,.btn--32 .spinner{width:20px;height:20px}
.btn[data-state="loading"] .btn-label{display:none}
.btn[data-state="loading"] .spinner{display:inline-block}
.btn[data-state="dim"]{cursor:default}
@keyframes btnspin{to{transform:rotate(360deg)}}

.btn--primary{background:var(--btn-primary-bg);color:var(--btn-primary-text)}
.btn--primary:hover,.btn--primary[data-state="hover"]{background:var(--btn-primary-bg-hover)}
.btn--primary[data-state="dim"]{background:var(--btn-primary-bg-dim);color:var(--btn-primary-text-dim)}
.btn--secondary{background:transparent;border:1px solid var(--btn-secondary-border);color:var(--btn-secondary-text)}
.btn--secondary:hover,.btn--secondary[data-state="hover"]{background:var(--btn-secondary-bg-hover)}
.btn--secondary[data-state="dim"]{background:transparent;border-color:var(--btn-secondary-border-dim);color:var(--btn-secondary-text-dim)}
.btn--tertiary{background:var(--btn-tertiary-bg);border:1px solid var(--btn-tertiary-border);color:var(--btn-tertiary-text)}
.btn--tertiary:hover,.btn--tertiary[data-state="hover"]{background:var(--btn-tertiary-bg-hover);border-color:var(--btn-tertiary-border-hover)}
.btn--tertiary[data-state="dim"]{background:var(--btn-tertiary-bg);border-color:var(--btn-tertiary-border);color:var(--btn-tertiary-text-dim)}
.btn--quaternary{background:transparent;border:1px solid var(--btn-quaternary-border);color:var(--btn-quaternary-text)}
.btn--quaternary:hover,.btn--quaternary[data-state="hover"]{background:var(--btn-quaternary-bg-hover);border-color:var(--btn-quaternary-border-hover);color:var(--btn-quaternary-text-hover)}
.btn--quaternary[data-state="dim"]{background:transparent;border-color:var(--btn-quaternary-border-dim);color:var(--btn-quaternary-text-dim)}

.btn-matrix-row{margin-bottom:var(--space-28)}
.btn-matrix-row:last-child{margin-bottom:0}
.hi-label{color:var(--primary-400);font-weight:800;font-size:var(--fs-b4);margin-bottom:var(--space-12)}
.btn-cells{display:flex;gap:var(--space-12);flex-wrap:wrap;align-items:flex-start}
.btn-cells .cell-cap{color:var(--mono-500);font-size:var(--fs-c2);font-family:monospace;text-align:center;margin-top:var(--space-6)}

/* ============================ 패턴 예시 (TRAINING 홈) ============================ */
.ex-label{text-transform:uppercase;letter-spacing:.15em;color:var(--mono-500);font-size:var(--fs-c1);font-weight:700;margin-bottom:var(--space-12)}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-4);padding:var(--space-24)}
.motto-card{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-20);margin-bottom:var(--space-16)}
.motto-text{color:var(--em);font-size:var(--fs-b2);font-weight:700;line-height:1.5;word-break:keep-all;flex:1}
.motto-text .qm{color:var(--accent);font-weight:900}
.streak-badge{
  display:inline-flex;align-items:center;gap:var(--space-10);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-1000);padding:var(--space-8) var(--space-20);color:var(--mono-300);
  font-weight:600;margin-bottom:var(--space-16);font-size:var(--fs-b4);
}
.stats-row{display:flex;gap:var(--space-12);flex-wrap:wrap;margin-bottom:var(--space-28)}
.stat-box{
  flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-4);
  padding:var(--space-20) var(--space-16);text-align:center;position:relative;
}
.stat-box::after{content:'';position:absolute;left:var(--space-16);right:var(--space-16);bottom:0;height:2px;background:var(--accent)}
.stat-box .num{font-size:var(--fs-h6);line-height:1.1;font-weight:900;color:var(--accent)}
.stat-box .lbl{font-size:var(--fs-c1);letter-spacing:.14em;color:var(--mono-500);text-transform:uppercase;margin-top:var(--space-6);font-weight:700}
.goal-card{display:flex;justify-content:space-between;align-items:center;gap:var(--space-24);flex-wrap:wrap;margin-bottom:var(--space-16)}
.goal-info{flex:1;min-width:200px}
.goal-info h4{color:var(--em);font-size:var(--fs-h6);line-height:var(--lh-h6);font-weight:900;text-transform:uppercase;letter-spacing:.01em;margin:var(--space-6) 0}
.goal-meta{color:var(--mono-300);font-size:var(--fs-b4);letter-spacing:.05em}
.dday{font-size:var(--fs-h6);font-weight:900;color:var(--accent);text-align:center;min-width:110px;line-height:1}
.dday small{display:block;font-size:var(--fs-c2);color:var(--mono-500);letter-spacing:.2em;font-weight:700;margin-top:var(--space-8)}
.goal-actions{display:flex;flex-direction:column;gap:var(--space-8)}
.goal-actions .row2{display:flex;gap:var(--space-8)}
.goal-actions .row2 .btn{flex:1}
.btn-add{background:transparent;border:none;color:var(--accent);font-weight:800;font-size:var(--fs-b3);letter-spacing:.03em;padding:var(--space-10) var(--space-8);font-family:inherit;cursor:pointer}
.btn-add:hover{opacity:.82}

/* ============================ 페이지 푸터 / 이전·다음 ============================ */
.page-foot{margin-top:var(--space-80);padding-top:var(--space-24);border-top:1px solid var(--border)}
.updated{color:var(--mono-500);font-size:var(--fs-b5);font-family:monospace;margin-bottom:var(--space-24)}
.pager{display:flex;gap:var(--space-12);justify-content:space-between}
.pager a{
  flex:1;max-width:47%;text-decoration:none;background:var(--mono-900);border:1px solid var(--border);
  border-radius:var(--radius-12);padding:var(--space-16) var(--space-20);transition:border-color .15s ease;
}
.pager a:hover{border-color:var(--mono-600)}
.pager .dir{display:block;color:var(--mono-500);font-size:var(--fs-c1);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:var(--space-6)}
.pager .ttl{display:block;color:var(--mono-050);font-size:var(--fs-b4);font-weight:600}
.pager a.next{text-align:right;margin-left:auto}

/* 준비 중 페이지 */
.wip-box{
  background:var(--mono-900);border:1px dashed var(--mono-600);border-radius:var(--radius-12);
  padding:var(--space-48) var(--space-32);text-align:center;
}
.wip-box .wip-t{color:var(--mono-200);font-size:var(--fs-b2);font-weight:700;margin-bottom:var(--space-10)}
.wip-box .wip-d{color:var(--mono-500);font-size:var(--fs-b4);line-height:var(--lh-b4);word-break:keep-all}
</style>

};

/* 아이콘 하나를 그립니다. size 기본 24, 색은 상위 요소의 color를 따릅니다. */
function icon(name, size){
  const d = ICONS[name];
  if(!d) return '';
  const s = size || 24;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
}

        <div style="color:var(--mono-600);font-size:var(--fs-b2)">→</div>
        <div style="text-align:center">
          <button class="btn btn--primary btn--40">운동 시작</button>
          <div style="color:var(--mono-500);margin-top:var(--space-6);font-size:var(--fs-c1)">화면</div>
        </div>
      </div>`,'원시 값이 이름을 얻고, 쓰임새를 얻고, 화면에 도달하는 경로')}

    ${U.h2('naming','이름 규칙')}
    ${U.p('Figma에서는 슬래시로 계층을 나누고, 코드에서는 같은 이름을 하이픈으로 잇습니다. 두 이름은 항상 1:1로 대응합니다.')}
    ${U.table(['종류','Figma','CSS 변수'],[
      [['','색 (Primitive)'],['mono','Mono/900'],['val','--mono-900']],
      [['','색 (Semantic)'],['mono','Button/Primary/BG'],['val','--btn-primary-bg']],
      [['','간격'],['mono','Spacing/16'],['val','--space-16']],
      [['','라운드'],['mono','Radius/12'],['val','--radius-12']],
      [['','텍스트'],['mono','B3'],['val','--fs-b3 / --lh-b3']]
    ])}

    ${U.h2('guide','사용 가이드')}
    ${U.guide(
      ['화면을 만들 때는 Semantic 토큰을 먼저 찾습니다',
       '적당한 토큰이 없으면 가장 가까운 기존 단계를 씁니다',
       '새 단계가 정말 필요하면 시스템에 추가하고 이 문서에 기록합니다'],
      ['Primitive를 화면에 직접 쓰기 (Semantic을 거치지 않기)',
       '토큰에 없는 중간값을 임의로 만들기 (예: 18px 라운드)',
       '같은 의미인데 화면마다 다른 토큰 쓰기']
    )}
  `},

  { slug:'logo', title:'Logo', desc:'워드마크·심볼·파비콘 브랜드 에셋', body:()=>`
    ${U.lead('HOMUSCLE의 브랜드 마크는 전체 워드마크와 축약형 마크(HMC) 두 가지 형태로 준비되어 있습니다.')}
    ${U.p('두 형태 모두 <b>아웃라인 처리된 벡터</b>라 폰트 설치 여부와 무관하게 어디서든 같은 모양으로 보입니다. 색은 전부 <code>Primary/500 (#ff6300)</code> 하나로 통일되어 있습니다.')}

    ${U.h2('wordmark','워드마크')}
    ${U.p('가로로 충분한 공간이 있을 때 쓰는 기본 형태입니다. 이 문서 사이트의 헤더에도 같은 에셋이 들어가 있습니다.')}
    <div class="logo-pair">
      <div>
        <div class="logo-stage">${BRAND.wordmark(22)}</div>
        <div class="logo-cap">어두운 배경 (기본)</div>
      </div>
      <div>
        <div class="logo-stage on-light">${BRAND.wordmark(22)}</div>
        <div class="logo-cap">밝은 배경</div>
      </div>
    </div>

    ${U.h2('symbol','축약형 마크 — HMC')}
    ${U.p('가로 공간이 부족할 때 쓰는 축약형입니다. 두 파일로 나뉘어 있는데, 형태는 같고 <b>프레임 안의 여백이 다릅니다.</b>')}
    ${U.ul([
      '<code>Symbol.svg</code> — 48×48 프레임 안에 여백을 두고 놓인 형태. 다른 요소와 나란히 배치할 때 씁니다.',
      '<code>favicon.svg</code> — 128×128 프레임을 가로로 꽉 채운 형태. 브라우저 탭처럼 아주 작게 보일 때를 위한 버전입니다.'
    ])}
    <div class="logo-pair">
      <div>
        <div class="logo-stage">${BRAND.symbol(180)}</div>
        <div class="logo-cap">Symbol.svg · 48×48 프레임 (여백 포함)</div>
      </div>
      <div>
        <div class="logo-stage">${BRAND.favicon(150)}</div>
        <div class="logo-cap">favicon.svg · 128×128 프레임 (꽉 채움)</div>
      </div>
    </div>

    ${U.h2('favicon','파비콘')}
    ${U.p('이 문서 사이트의 브라우저 탭 아이콘으로 <code>favicon.svg</code>가 들어가 있습니다. 실제 탭에서 보이는 크기는 아래와 같습니다.')}
    ${U.demo(`<div style="display:flex;align-items:flex-end;gap:var(--space-32)">
      ${[64,32,16].map(s => `<div style="text-align:center">${BRAND.favicon(s)}<div class="logo-cap">${s}px</div></div>`).join('')}
    </div>`,'16px에서도 형태가 유지되도록 프레임을 꽉 채운 버전을 씁니다')}

    ${U.h2('assets','에셋')}
    ${U.table(['에셋','파일','프레임','색'],[
      [['name','워드마크'],['mono','assets/brand/Bi.svg'],['val','165 × 15'],['','Primary/500 #ff6300']],
      [['name','축약형 마크'],['mono','assets/brand/Symbol.svg'],['val','48 × 48'],['','Primary/500 #ff6300']],
      [['name','파비콘'],['mono','assets/brand/favicon.svg'],['val','128 × 128'],['','Primary/500 #ff6300']]
    ])}
    ${U.note('코드에서 쓸 때',
      '세 에셋 모두 SVG라 <code>fill</code>을 <code>currentColor</code>로 바꾸면 상위 요소의 <code>color</code>를 따라갑니다. 이 사이트 헤더도 그 방식으로 <code>var(--primary-500)</code>에 연결해 두었습니다 — 브랜드 색을 바꾸면 로고도 함께 따라옵니다.',
      '파비콘은 <code>&lt;link rel="icon" type="image/svg+xml"&gt;</code>으로 넣습니다.')}

    ${U.h2('guide','사용 가이드')}
    ${U.guide(
      ['가로 공간이 부족하면 워드마크를 줄이지 말고 축약형(HMC)으로 바꿉니다',
       '아주 작게 쓸 때는 favicon.svg 쪽을 씁니다',
       '단색 배경 위에 올립니다'],
      ['비율을 바꾸거나 기울이기',
       '브랜드 오렌지가 아닌 색으로 칠하기',
       '복잡한 사진 위에 여과 없이 올리기',
       '워드마크를 다시 타이핑해서 대체하기 (아웃라인 에셋을 씁니다)']
    )}

    ${U.note('아직 정해지지 않은 것',
      '여백(clearspace)과 최소 사용 크기의 수치가 Figma에 아직 규정되어 있지 않습니다. 위 가이드는 원칙만 적어둔 것이고, 정확한 값이 정해지면 이 페이지에 표로 추가합니다.')}
  `},

  { slug:'color', title:'Color', desc:'Mono · Primary · Red 팔레트', body:()=>`
    ${U.lead('HOMUSCLE의 색은 어두운 배경 위에서 오렌지 하나가 또렷하게 살아나도록 설계되어 있습니다.')}
    ${U.p('중립색은 순수한 회색이 아니라 <b>따뜻한 쪽으로 살짝 기운 웜그레이</b>입니다. 오렌지와 같은 온도를 공유해서, 강조색이 배경 위에 이물감 없이 얹힙니다. 경고와 삭제에만 Red를 쓰고, 그 외에는 팔레트를 늘리지 않습니다.')}

    ${U.h2('mono','Mono — 웜그레이 13단계')}
    ${U.p('배경부터 본문 텍스트까지, 화면의 대부분을 차지하는 중립 계열입니다. 숫자가 클수록 어둡습니다.')}
    ${U.swatches('Mono', T.mono)}

    ${U.h2('primary','Primary — 오렌지 13단계')}
    ${U.p('브랜드 색이자 유일한 강조색입니다. 화면에서 "지금 눌러야 할 것" 하나를 가리키는 데 씁니다.')}
    ${U.swatches('Primary', T.primary)}

    ${U.h2('red','Red — 경고 10단계')}
    ${U.p('되돌릴 수 없는 동작(삭제)과 오류 상태에만 사용합니다. Primary(주황, hue 23°)와 헷갈리지 않도록 hue를 0°(로즈 레드) 쪽으로 옮기고 채도를 낮췄습니다. 텍스트로 쓰는 값은 #111 배경 기준 WCAG AA(4.5:1) 이상입니다.')}
    ${U.swatches('Red', T.red)}
    ${U.table(['단계','값','쓰임'],[
      [['name','Red/200'],['val',U.dot('#f0a3a3')],['','Danger 버튼 hover 글자']],
      [['name','Red/300'],['val',U.dot('#e08a8a')],['','Danger 버튼 기본 글자 · 오류 텍스트 (#111 위 7.3:1)']],
      [['name','Red/500'],['val',U.dot('#c4585b')],['','Danger 버튼 hover 선']],
      [['name','Red/700'],['val',U.dot('#5a2a2b')],['','Danger 버튼 기본 선']],
      [['name','Red/900'],['val',U.dot('#2a1415')],['','Danger 버튼 hover 배경']]
    ])}

    ${U.h2('semantic','Semantic — 역할별 색')}
    ${U.p('화면을 만들 때 실제로 참조하는 이름입니다. 각각이 어떤 프리미티브를 가리키는지는 아래와 같습니다.')}
    ${U.table(['역할','CSS 변수','참조','값'],[
      [['name','페이지 배경'],['mono','--bg'],['','Mono/990'],['val',U.dot('#0a0a0a')]],
      [['name','카드 표면'],['mono','--surface'],['','Mono/900'],['val',U.dot('#111111')]],
      [['name','테두리'],['mono','--border'],['','Mono/800'],['val',U.dot('#1d1b1a')]],
      [['name','비활성 요소'],['mono','--muted'],['','Mono/600'],['val',U.dot('#393736')]],
      [['name','보조 텍스트'],['mono','--sub'],['','Mono/400'],['val',U.dot('#848281')]],
      [['name','부가 텍스트'],['mono','--aux'],['','Mono/300'],['val',U.dot('#9d9b9a')]],
      [['name','본문 텍스트'],['mono','--text'],['','Mono/100'],['val',U.dot('#cecccb')]],
      [['name','강조 텍스트'],['mono','--em'],['','순백 유지'],['val',U.dot('#ffffff')]],
      [['name','강조색'],['mono','--accent'],['','Primary/500'],['val',U.dot('#ff6300')]]
    ])}

    ${U.h3('텍스트 · 테두리 Semantic')}
    ${U.p('Figma <code>Semantic</code> 컬렉션에 등록된 이름입니다. 화면을 만들 때는 프리미티브 대신 이쪽을 참조합니다.')}
    ${U.table(['Semantic','→ Primitive','값','쓰임'],[
      [['name','Text/Strong'],['mono','Base/White'],['val',U.dot('#ffffff')],['','제목, 수치 강조']],
      [['name','Text/Default'],['mono','Mono/100'],['val',U.dot('#cecccb')],['','본문']],
      [['name','Text/Sub'],['mono','Mono/300'],['val',U.dot('#9d9b9a')],['','보조 설명']],
      [['name','Text/Caption'],['mono','Mono/400'],['val',U.dot('#848281')],['','캡션, 라벨']],
      [['name','Text/Disabled'],['mono','Mono/600'],['val',U.dot('#393736')],['','비활성 텍스트']],
      [['name','Text/Brand'],['mono','Primary/500'],['val',U.dot('#ff6300')],['','강조 텍스트, 수치']],
      [['name','Border/Default'],['mono','Mono/800'],['val',U.dot('#1d1b1a')],['','카드·구분선']],
      [['name','Border/Strong'],['mono','Mono/600'],['val',U.dot('#393736')],['','hover 시 테두리']],
      [['name','Border/Brand'],['mono','Primary/500'],['val',U.dot('#ff6300')],['','강조 테두리']]
    ])}
    ${U.note('--em과 --accent에 대하여',
      '<code>--em</code>은 Mono/010(#fefcfb)이 아니라 순백 #ffffff을 유지합니다. 어두운 배경에서 가장 강한 대비가 필요한 자리이기 때문입니다.',
      '<code>--accent</code>는 <code>Primary/500</code>을 가리킵니다. 예전에는 램프에 없는 <code>#ff6b00</code>을 따로 쓰고 있었지만, 시스템 밖에 색이 하나 떠 있는 상태를 없애려고 램프 안으로 들여왔습니다.')}

    ${U.h2('guide','사용 가이드')}
    ${U.guide(
      ['한 화면에서 오렌지는 가장 중요한 동작 하나에만 씁니다',
       '텍스트 위계는 --em → --text → --aux → --sub 순서로 낮춥니다',
       '삭제·오류에는 Red 계열을 씁니다 — 글자 Red/300, 선 Red/700'],
      ['강조색을 여러 요소에 동시에 쓰기 (강조가 강조를 지웁니다)',
       '중립색 자리에 순수 회색(#888 등) 쓰기 — 팔레트의 온도가 깨집니다',
       'Red를 강조 목적으로 쓰기 — 경고로만 남겨둡니다']
    )}
  `},

  { slug:'typography', title:'Typography', desc:'Pretendard 기반 13단계 타입 스케일', body:()=>`
    ${U.lead('본문 서체는 Pretendard 하나만 씁니다. 로고와 인트로 워드마크는 웹폰트가 아니라 SVG 패스 에셋입니다(Ethnocentric 글자꼴을 아웃라인으로 딴 것 — 웹폰트 임베딩은 라이선스 제외 항목이라 로고 아트워크로 처리했습니다). 크기는 13단계로 고정되어 있습니다.')}
    ${U.p('Heading(H1~H6)은 제목답게 촘촘한 행간을, Body(B1~B5)와 Caption(C1~C2)은 읽기 편한 넉넉한 행간을 갖습니다. 각 단계는 Bold(700) · Medium(500) · Regular(400) 세 웨이트로 정의되어 있습니다.')}

    ${U.h2('scale','타입 스케일')}
    ${U.table(['단계','크기','행간','비율'],
      T.type.map(([n,fs,lh,ratio]) => [['name',n],['val',fs],['val',lh],['mono',ratio]]))}

    ${U.h2('sample','실제 렌더링')}
    <div class="demo">${T.type.map(([n,fs,lh]) => `
      <div class="type-row">
        <div class="type-meta"><b>${n}</b><span>${fs} / ${lh}</span></div>
        <div class="type-sample" style="font-size:${fs};line-height:${lh};font-weight:700">홈에서 운동을 기록하세요</div>
      </div>`).join('')}</div>

    ${U.h2('ratio','행간 설계')}
    ${U.p('Heading의 행간 비율은 <b>H1 1.15에서 H6 1.40까지 0.05씩 단계적으로 넓어집니다.</b> 큰 글자일수록 줄 사이가 상대적으로 넓어 보이기 때문에, 큰 제목일수록 비율을 좁혀 시각적 밀도를 맞춘 것입니다.')}
    ${U.p('Body와 Caption은 1.6~1.75 사이로 넉넉하게 유지합니다. 여러 줄이 이어질 때 읽는 흐름이 끊기지 않도록 하기 위함입니다.')}

    ${U.h2('guide','사용 가이드')}
    ${U.guide(
      ['제목 계층은 H단계를 순서대로 씁니다',
       '본문은 B3(16px)를 기본으로 삼습니다',
       '캡션·라벨처럼 보조적인 글자에만 C단계를 씁니다'],
      ['스케일에 없는 크기를 임의로 쓰기 (예: 15px, 22px)',
       '크기를 건너뛰어 위계를 만들기 (H2 다음 바로 H5)',
       '행간을 크기와 무관하게 임의로 조정하기']
    )}
  `},

  { slug:'iconography', title:'Iconography', desc:'24×24 키라인 기반 아이콘 10종', body:()=>`
    ${U.lead('아이콘은 글자 없이 의미를 전달하는 가장 작은 단위입니다. 모두 24×24 키라인 위에서 그려져 서로 같은 무게로 보입니다.')}
    ${U.p('현재 10종이 등록되어 있습니다. 선이 아니라 <b>면(fill)으로 그려진 형태</b>라, 어두운 배경에서도 형태가 뭉개지지 않습니다.')}

    ${U.h2('set','아이콘 세트')}
    <div class="icon-grid">${Object.keys(ICONS).map(n =>
      `<div class="icon-cell">${icon(n,24)}<div class="nm">${n}</div></div>`).join('')}</div>

    ${U.h2('keyline','키라인 그리드')}
    ${U.p('모든 아이콘은 24×24 프레임 안의 공통 키라인에 맞춰 그립니다. 형태마다 시각적 크기가 달라 보이는 것을 막기 위해, 정사각형은 18, 원은 20처럼 서로 다른 기준을 씁니다.')}
    <div class="demo">
      <div class="keyline-wrap">
        <div class="keyline-box">
          <svg width="144" height="144" viewBox="0 0 24 24" fill="none">
            <rect x="0" y="0" width="24" height="24" fill="none" stroke="#393736" stroke-width=".25"/>
            <rect x="3" y="3" width="18" height="18" stroke="#ff7726" stroke-width=".25" fill="none"/>
            <circle cx="12" cy="12" r="10" stroke="#ff7726" stroke-width=".25" fill="none"/>
            <rect x="2" y="4" width="20" height="16" stroke="#666463" stroke-width=".25" fill="none"/>
            <rect x="4" y="2" width="16" height="20" stroke="#666463" stroke-width=".25" fill="none"/>
            <line x1="0" y1="0" x2="24" y2="24" stroke="#272524" stroke-width=".25"/>
            <line x1="24" y1="0" x2="0" y2="24" stroke="#272524" stroke-width=".25"/>
          </svg>
        </div>
        <div style="flex:1;min-width:220px">
          ${U.table(['기준 도형','크기'],[
            [['name','프레임'],['val','24 × 24']],
            [['name','정사각형'],['val','18 × 18']],
            [['name','원'],['val','지름 20']],
            [['name','가로 직사각형'],['val','20 × 16']],
            [['name','세로 직사각형'],['val','16 × 20']]
          ])}
        </div>
      </div>
    </div>

    ${U.h2('size','크기')}

/* ============================================================================
   라우터 · 렌더링
============================================================================ */
const FLAT = [];
NAV.forEach(sec => sec.pages.forEach(pg => FLAT.push({ ...pg, sectionKey:sec.key, sectionLabel:sec.label })));

function findPage(sectionKey, slug){
  return FLAT.find(p => p.sectionKey===sectionKey && p.slug===slug);
}

function parseHash(){
  const raw = location.hash.replace(/^#\/?/, '');
  const [sectionKey, slug] = raw.split('/');
  const page = findPage(sectionKey, slug);
  return page || FLAT[0];
}

function renderTopNav(activeSection){
  document.getElementById('topNav').innerHTML = NAV.map(sec =>
    `<a href="#/${sec.key}/${sec.pages[0].slug}" class="${sec.key===activeSection?'active':''}">${sec.label}</a>`
  ).join('');
}

function renderSidebar(activePage, query){
  const el = document.getElementById('sidebarNav');
  const q = (query||'').trim().toLowerCase();

  if(q){
    const hits = FLAT.filter(p =>
      p.title.toLowerCase().includes(q) ||
      (p.desc||'').toLowerCase().includes(q) ||
      p.sectionLabel.toLowerCase().includes(q)
    );
    el.innerHTML = hits.length
      ? `<div class="side-group"><div class="side-group-label">검색 결과 ${hits.length}</div>${
          hits.map(p => `<a class="side-link ${p===activePage?'active':''}" href="#/${p.sectionKey}/${p.slug}">
            <span>${p.sectionLabel} · ${p.title}</span>${p.status==='wip'?'<span class="wip">준비 중</span>':''}</a>`).join('')
        }</div>`
      : `<div class="side-empty">검색 결과가 없습니다.</div>`;
    return;
  }

  const sec = NAV.find(s => s.key===activePage.sectionKey);
  el.innerHTML = `<div class="side-group">
    <div class="side-group-label">${sec.label}</div>
    ${sec.pages.map(p => `<a class="side-link ${p.slug===activePage.slug?'active':''}" href="#/${sec.key}/${p.slug}">
      <span>${p.title}</span>${p.status==='wip'?'<span class="wip">준비 중</span>':''}</a>`).join('')}
  </div>`;
}

function wipBody(page){
  return `<div class="wip-box">
    <div class="wip-t">${page.title} 문서는 아직 준비 중입니다</div>
    <div class="wip-d">${page.desc}<br>이 항목이 정리되면 이곳에 정의·토큰·사용 가이드가 채워집니다.</div>
  </div>`;
}

function renderPage(page){
  const idx  = FLAT.indexOf(page);
  const prev = FLAT[idx-1];
  const next = FLAT[idx+1];

  const body = page.status==='wip' ? wipBody(page) : page.body();

  document.getElementById('content').innerHTML = `
    <div class="breadcrumb">${page.sectionLabel}<span>/</span>${page.title}</div>
    <h1>${page.title}</h1>
    ${body}
    <div class="page-foot">
      <div class="updated">최종 수정 · 2026. 9. 6.</div>
      <div class="pager">
        ${prev?`<a class="prev" href="#/${prev.sectionKey}/${prev.slug}"><span class="dir">이전 문서</span><span class="ttl">${prev.title}</span></a>`:'<span></span>'}
        ${next?`<a class="next" href="#/${next.sectionKey}/${next.slug}"><span class="dir">다음 문서</span><span class="ttl">${next.title}</span></a>`:''}
      </div>
    </div>`;

  renderToc();
}

function renderToc(){
  const heads = [...document.querySelectorAll('#content h2[id]')];
  const el = document.getElementById('tocList');
  el.innerHTML = heads.length
    ? heads.map(h => `<a href="#${h.id}" data-target="${h.id}">${h.textContent}</a>`).join('')
    : '<div class="side-empty" style="padding:0">—</div>';

  // TOC 클릭은 해시 라우팅과 충돌하므로 직접 스크롤 처리
  el.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const t = document.getElementById(a.dataset.target);
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  observeHeadings(heads);
}

let tocObserver = null;
function observeHeadings(heads){
  if(tocObserver) tocObserver.disconnect();
  if(!heads.length) return;
  const links = new Map([...document.querySelectorAll('#tocList a')].map(a => [a.dataset.target, a]));
  tocObserver = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const a = links.get(en.target.id);
      if(!a) return;
      if(en.isIntersecting){
        links.forEach(l => l.classList.remove('active'));
        a.classList.add('active');
      }
    });
  }, { rootMargin:'-70px 0px -75% 0px', threshold:0 });
  heads.forEach(h => tocObserver.observe(h));
}

function route(){
  const page = parseHash();
  renderTopNav(page.sectionKey);
  renderSidebar(page, document.getElementById('searchInput').value);
  renderPage(page);
  document.querySelector('.content-wrap').scrollTop = 0;
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);
document.getElementById('searchInput').addEventListener('input', e => {
  renderSidebar(parseHash(), e.target.value);
});
route();
</script>
